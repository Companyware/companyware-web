imports:
    - { resource: '../plugins/*/config/services.yaml', ignore_errors: not_found }

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Core/'
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    _instanceof:
        Companyware\Core\Framework\Plugin\Contract\NavigationProviderInterface:
            tags: ['app.plugin.navigation']
        Companyware\Core\Framework\Plugin\Contract\SlotProviderInterface:
            tags: ['app.plugin.slot']
        Companyware\Core\Framework\Plugin\Contract\FrontendProviderInterface:
            tags: ['app.plugin.frontend']
        Companyware\Core\Framework\Api\ApiOperationProviderInterface:
            tags: ['app.api.operation_provider']

    App\Plugin\NavigationRegistry:
        arguments:
            $providers: !tagged_iterator app.plugin.navigation

    App\Plugin\SlotRenderer:
        arguments:
            $providers: !tagged_iterator app.plugin.slot

    App\Plugin\FrontendRegistry:
        arguments:
            $providers: !tagged_iterator app.plugin.frontend

    App\Api\OpenApiRegistry:
        arguments:
            $providers: !tagged_iterator app.api.operation_provider

    App\Plugin\PluginTwigLoader:
        arguments:
            $loader: '@twig.loader.native_filesystem'

    App\Plugin\PluginLifecycleManager:
        arguments:
            $plugins: !tagged_locator { tag: 'app.plugin.lifecycle', index_by: 'plugin' }

    App\Plugin\PluginPackageInstaller:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $cacheDir: '%kernel.cache_dir%'

    App\Command\CreatePluginCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Plugin\PluginPackageLocator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Extension\PublisherTrustStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Companyware\Core\Framework\Plugin\Contract\PluginConfigurationInterface:
        alias: App\Plugin\PluginConfiguration

    Companyware\Core\Framework\Plugin\Contract\Migration\MigrationStateProviderInterface:
        alias: App\Plugin\Migration\MigrationManager

    Companyware\Core\Framework\File\FileNameNormalizerInterface:
        alias: App\Framework\File\FileNameNormalizer

    Companyware\Core\Framework\Data\ConnectionProviderInterface:
        alias: App\Infrastructure\Database

    Companyware\Core\Framework\Security\AuthorizationInterface:
        alias: App\Security\AuthorizationService

    Companyware\Core\Framework\Application\ActorContextInterface:
        alias: App\Application\RequestActorContext

    Companyware\Core\Framework\Api\IdempotencyServiceInterface:
        alias: App\Api\IdempotencyService

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
