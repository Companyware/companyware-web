name: Bug report
description: Report a reproducible Companyware Web defect without confidential data
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials, personal data or production exports here. Use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Exact Git commit or immutable release version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP, database, browser and relevant plugin versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed credentials, personal data, production exports and private keys.
          required: true
